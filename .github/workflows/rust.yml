name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the push
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The fast path is "documentation only since a green head": the push's
          # previous head must have a successful run of this workflow, and every
          # path changed since it must end in .md and lie outside docs/validation/
          # (whose historical records the migration check guards). A pull request
          # that is opened, reopened or whose base changes, a push without a
          # comparable previous head, a failed or cancelled previous run and a
          # manual run all take the full run. An empty output means a full run.
          docs_only=false
          case "$EVENT_NAME" in
            pull_request) [ "$EVENT_ACTION" = synchronize ] && base="$BEFORE" && head="$AFTER" || base="" ;;
            push) base="$BEFORE"; head="$AFTER" ;;
            *) base="" ;;
          esac
          if [ -n "${base:-}" ] && [ -n "${head:-}" ] && git cat-file -e "$base^{commit}" 2>/dev/null && git cat-file -e "$head^{commit}" 2>/dev/null; then
            green=$(gh api "repos/$REPO/actions/workflows/rust.yml/runs?head_sha=$base&status=success&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
            changed="$(git diff --name-only --no-renames "$base" "$head")"
            printf 'previous head %s (successful runs of this workflow: %s)\nhead %s\nchanged paths:\n%s\n' "$base" "$green" "$head" "$changed"
            if [ "$green" -ge 1 ] && [ -n "$changed" ] && ! grep -qvE '\.md$' <<<"$changed" && ! grep -qE '^docs/validation/' <<<"$changed"; then
              docs_only=true
            fi
          else
            echo "no comparable previous head; running every check"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  stable:
    name: Stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Keep the required check name; use supported Intel macOS while arm64
    # hosted-runner acquisition is capacity constrained (see VALIDATION.md).
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-26-intel' || matrix.os }}
    # Retain every validation step. M4a's first 2e33c35 macOS attempt hit
    # its 40-minute limit; the retry took 33m33s. Ubuntu took 32m33s of 45,
    # and Windows 11m57s of 30. Give the growing suite explicit headroom.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 60 }}
    needs: changes
    # Run even if the classification failed: an empty output means a full run.
    if: ${{ !cancelled() }}
    env:
      # A documentation-only change (every changed path ends in .md) skips the heavy
      # steps below; the job itself still runs and reports, so the required check
      # names keep reporting. Classified by the `changes` job, never by paths-ignore.
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        if: env.DOCS_ONLY != 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Clippy
        if: env.DOCS_ONLY != 'true'
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        if: env.DOCS_ONLY != 'true'
        run: cargo +stable build --workspace --locked
      - name: Test
        if: env.DOCS_ONLY != 'true'
        run: cargo +stable test --workspace --locked
      - name: Release deterministic checks
        if: env.DOCS_ONLY != 'true'
        run: cargo +stable test -p doom-sim -p doom-types --release --locked
      - name: Reproduce isolated reference vectors and snapshot goldens
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          python3 tools/reference/run_reference.py --suite --jobs 4
      - name: Verify lossless historical migration against baseline Git objects
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          git fetch --no-tags --depth=1 origin 138c66b6c6b6d57d0b18cf945d8661722741bd66
          python3 tools/reference/evidence_storage.py verify-git
      - name: Independent original weapon formula components
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/weapon_formulas_reference.py --check --sanitize
      - name: Independent original armor, animation, pickup and absorption evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3g10_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3g10_snapshot_goldens.py --check
      - name: Independent original bonus, animation, resource and counted-item evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3g11_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3g11_snapshot_goldens.py --check
      - name: Independent original former-human, mixed-roster and infighting evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h1_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3h1_snapshot_goldens.py --check
      - name: Original former-human encounter debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_monsters.py
      - name: Independent original Imp, fireball and mixed-roster evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h2_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3h2_snapshot_goldens.py --check
      - name: Original Imp encounter debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_imps.py
      - name: Independent original real-map-scale evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h3_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3h3_snapshot_goldens.py --check
      - name: Original real-map-scale debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_map_scale.py
      - name: Independent original static-heights evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h4_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3h4_snapshot_goldens.py --check
      - name: Original static-heights debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_heights.py
      - name: Independent original diagonal-wall evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h5_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3h5_snapshot_goldens.py --check
      - name: Original diagonal-wall debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_diagonal.py
      - name: Independent original real-map-scale room evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h6_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3h6_snapshot_goldens.py --check
      - name: Original real-map-scale room debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_real_map.py
      - name: Independent original sky and static-specials evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h7_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3h7_snapshot_goldens.py --check
      - name: Original sky and static-specials debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_specials.py
      - name: Independent original doors, lifts, floors, switches and exit evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h8_reference.py --check --overflow-check --address-check
      - name: Independent DSIM35 doors, lifts, floors, switches and exit projection
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/m3h8_snapshot_goldens.py --check
      - name: Original doors, lifts, floors, switches and exit full replay debug/release comparison
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/check_player_movers.py
      - name: Original doors, lifts, floors, switches and exit example debug/release comparison
        if: env.DOCS_ONLY != 'true' && (runner.os != 'Linux')
        run: python3 tools/reference/check_player_movers.py --example-only
      - name: Independent original two-sided scroller, decoration and spawn-filter evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h9_reference.py --check --overflow-check --address-check
      - name: Independent DSIM36 two-sided scroller and decoration projection
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/m3h9_snapshot_goldens.py --check
      - name: Original two-sided scroller and decoration full replay debug/release comparison
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/check_player_e1m1.py
      - name: Original two-sided scroller and decoration example debug/release comparison
        if: env.DOCS_ONLY != 'true' && (runner.os != 'Linux')
        run: python3 tools/reference/check_player_e1m1.py --example-only
      - name: Independent original barrel, radius-attack, pickup-scale and angle evidence
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: |
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3h9b_reference.py --check --overflow-check --address-check
      - name: Independent DSIM37 barrel and pickup-scale projection
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/m3h9b_snapshot_goldens.py --check
      - name: Original barrel full replay debug/release comparison
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/check_player_barrels.py
      - name: Original barrel example debug/release comparison
        if: env.DOCS_ONLY != 'true' && (runner.os != 'Linux')
        run: python3 tools/reference/check_player_barrels.py --example-only
      - name: M3h9c whole-engine runner contract, synthetic game WAD and demo scripts
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          python3 tools/reference/m3h9c_build.py --check
          python3 tools/reference/m3h9c_wad.py --check
          python3 tools/e1m1_scripts.py --check
      - name: Genuine whole-engine run of the synthetic E1M1 (strict, UBSan and ASan/UBSan dumps identical)
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/m3h9c_reference.py --check --keep-dumps --work "$RUNNER_TEMP/m3h9c"
      - name: Whole-engine run logs (on failure only)
        if: failure() && env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        uses: actions/upload-artifact@v4
        with:
          name: m3h9c-whole-engine-logs
          path: ${{ runner.temp }}/m3h9c/runs/*.log
          if-no-files-found: ignore
      - name: Independent DSIM38 whole-level projection
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/m3h9c_snapshot_goldens.py --dumps "$RUNNER_TEMP/m3h9c/runs" --check
      - name: Rust whole-level run of the synthetic scripts against the encoder goldens
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          for s in SYNIDLE SYNWALK SYNFIGHT SYNBARRL SYNCHAOS SYNDIE; do
            cargo +stable run -p doom-sim --release --locked --example player_level_run -- --wad tests/reference/m3h9c_synthetic.wad --map E1M1 --demo "tests/reference/m3h9c_scripts/$s.lmp" --out "$RUNNER_TEMP/m3h9c_rust/$s" --captures
          done
          python3 tools/reference/check_player_level.py "$RUNNER_TEMP/m3h9c_rust"
      - name: M4a runner contract, synthetic mechanism WADs, their invariants and demo scripts
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          python3 tools/reference/m4a_build.py --check
          python3 tools/reference/test_runner_newlines.py
          python3 tools/reference/m4a_wad.py --check
          python3 tools/reference/m4a_check_wad.py --check
          python3 tools/e1m1_scripts.py --check
      - name: Genuine whole-engine runs of the M4a mechanism WADs (strict, UBSan and ASan/UBSan dumps identical) and self-test
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/m4a_reference.py --check --keep-dumps --selftest 300 --work "$RUNNER_TEMP/m4a"
      - name: Independent DSIM39 projection of the M4a runs
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/reference/m4a_snapshot_goldens.py --dumps "$RUNNER_TEMP/m4a/runs" --check
      - name: Rust Episode 1 run of the M4a synthetic scripts against the encoder goldens
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          cargo +stable build -p doom-sim --release --locked --example player_level_run
          EXE=target/release/examples/player_level_run
          if [ -f "$EXE.exe" ]; then EXE="$EXE.exe"; fi
          python3 tools/reference/check_player_episode1.py --binary "$EXE" --out "$RUNNER_TEMP/m4a_rust" --example-args "--policy episode1" --require
      - name: Original bonus sustained combat debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_bonuses.py
      - name: Original armor sustained combat debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_armor.py
      - name: Active player Demon debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_demon.py
      - name: Autonomous player Demon melee debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_demon_melee.py
      - name: Genuine player pistol debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_pistol.py
      - name: Original weapon pack debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_weapon_pack.py
      - name: Original world pickups debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_world_pickups.py
      - name: Player command debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_commands.py
      - name: Player knockback debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_player_knockback.py
      - name: Original player body debug/release comparison
        if: env.DOCS_ONLY != 'true'
        run: python3 tools/reference/check_original_player.py
      - name: Synthetic map example
        if: env.DOCS_ONLY != 'true'
        run: cargo +stable run -p doom-map --example parse_map --locked
      - name: Headless simulation example
        if: env.DOCS_ONLY != 'true'
        run: cargo +stable run -p doom-sim --example headless --locked -- 12
      - name: Headless debug/release equality
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          python tools/reference/check_headless.py
          python tools/reference/check_projectiles.py
          python tools/reference/check_monster_perception.py
          python tools/reference/check_monster_pursuit.py
          python tools/reference/check_monster_attacks.py
          python tools/reference/check_shotgunner_attacks.py
          python tools/reference/check_chaingunner_attacks.py
          python tools/reference/check_demon_melee.py
          python tools/reference/check_demon_lifecycle.py
          python tools/reference/check_demon_stand_run.py
          python tools/reference/check_demon_map_spawn.py
          python tools/reference/check_demon_map_context.py
          python tools/reference/check_map_scale.py
          python tools/reference/check_map_extent.py
          python tools/reference/check_demon_expanded_map.py
          python tools/reference/check_original_identity.py
          python tools/reference/check_canonical_demon.py
          python tools/reference/check_runtime_identity.py
          python tools/reference/check_original_registry.py
          python tools/reference/check_context_ownership.py
          python tools/reference/check_game_instance.py
          python tools/reference/check_diagnostic_free.py
      - name: Advisory stepping and allocation smoke
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/measure_stepping.py --check
      - name: Real-map-scale measurement smoke
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/measure_real_map.py --check
      - name: Sky and static-specials measurement smoke
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/measure_specials.py --check
      - name: Doors, lifts, floors, switches and exit measurement smoke
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/measure_movers.py --check
      - name: Two-sided scroller and decoration measurement smoke
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/measure_e1m1.py --check
      - name: Barrel and pickup-scale measurement smoke
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/measure_barrels.py --check
      - name: Advisory autonomous melee allocation smoke
        if: env.DOCS_ONLY != 'true' && (runner.os == 'Linux')
        run: python3 tools/measure_player_demon_melee.py --smoke
      - name: Documentation links and archive integrity
        run: python tools/check_docs.py
      - name: Documentation
        if: env.DOCS_ONLY != 'true'
        run: cargo +stable doc --workspace --no-deps --locked
      - name: Documentation-only fast path
        if: env.DOCS_ONLY == 'true'
        run: echo "documentation-only change, so the build, test, evidence and example steps were skipped and the documentation check ran"

  msrv:
    name: Minimum Rust / 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() }}
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        if: env.DOCS_ONLY != 'true'
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test minimum supported Rust
        if: env.DOCS_ONLY != 'true'
        run: cargo +1.85.0 test --workspace --locked
      - name: Documentation-only fast path
        if: env.DOCS_ONLY == 'true'
        run: echo "documentation-only change, so the build, test, evidence and example steps were skipped and the documentation check ran"
