name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  stable:
    name: Stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Keep the required check name; use supported Intel macOS while arm64
    # hosted-runner acquisition is capacity constrained (see VALIDATION.md).
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-26-intel' || matrix.os }}
    # Preserve the complete growing reference/encoder suite on Linux.
    # Native Intel post-merge CI reached the 15-minute limit after its examples.
    # Keep every check and allow the same headroom as the full Linux suite.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo +stable build --workspace --locked
      - name: Test
        run: cargo +stable test --workspace --locked
      - name: Release deterministic checks
        run: cargo +stable test -p doom-sim -p doom-types --release --locked
      - name: Reproduce isolated reference vectors and snapshot goldens
        if: runner.os == 'Linux'
        run: |
          python3 tools/reference/generate.py --check
          python3 tools/reference/snapshot_goldens.py --check
          python3 tools/reference/generate_m3a.py --check
          python3 tools/reference/m3a_snapshot_goldens.py --check
          python3 tools/reference/generate_m3b.py --check
          python3 tools/reference/m3b_snapshot_goldens.py --check
          python3 tools/reference/generate_m3c.py --check
          python3 tools/reference/m3c_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d1.py --check
          python3 tools/reference/m3d1_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d2.py --check
          python3 tools/reference/m3d2_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d2b.py --check
          python3 tools/reference/m3d2b_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3a.py --check
          python3 tools/reference/m3d3a_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3b.py --check
          python3 tools/reference/m3d3b_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3c.py --check
          python3 tools/reference/m3d3c_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3d.py --check
          python3 tools/reference/m3d3d_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3e.py --check
          python3 tools/reference/m3d3e_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3f.py --check
          python3 tools/reference/m3d3f_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3g.py --check
          python3 tools/reference/m3d3g_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3h.py --check
          python3 tools/reference/m3d3h_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3i.py --check
          python3 tools/reference/m3d3i_snapshot_goldens.py --check
          python3 tools/reference/generate_m3d3j.py --check
          python3 tools/reference/m3d3j_snapshot_goldens.py --check
          python3 tools/reference/m3f1_reference.py --check
          python3 tools/reference/m3f1_snapshot_goldens.py --check
          python3 tools/reference/m3f2_reference.py --check --overflow-check
          python3 tools/reference/m3f2_snapshot_goldens.py --check
          python3 tools/reference/m3f3_reference.py --check --overflow-check --probe-undefined-angle
          python3 tools/reference/m3f3_snapshot_goldens.py --check
          python3 tools/reference/m3f3_clipping_reference.py --check --overflow-check
          python3 tools/reference/m3f3_clipping_snapshot_goldens.py --check
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3f4_reference.py --check --sanitize
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3f5_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3f5_snapshot_goldens.py --check
          python3 tools/reference/m3f7_snapshot_goldens.py --check
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3f8_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3f8_snapshot_goldens.py --check
          ASAN_OPTIONS=detect_leaks=0 python3 tools/reference/m3g2_reference.py --check --overflow-check --address-check
          python3 tools/reference/m3g2_snapshot_goldens.py --check
      - name: Original player body debug/release comparison
        run: python3 tools/reference/check_original_player.py
      - name: Synthetic map example
        run: cargo +stable run -p doom-map --example parse_map --locked
      - name: Headless simulation example
        run: cargo +stable run -p doom-sim --example headless --locked -- 12
      - name: Headless debug/release equality
        run: |
          python tools/reference/check_headless.py
          python tools/reference/check_projectiles.py
          python tools/reference/check_monster_perception.py
          python tools/reference/check_monster_pursuit.py
          python tools/reference/check_monster_attacks.py
          python tools/reference/check_shotgunner_attacks.py
          python tools/reference/check_chaingunner_attacks.py
          python tools/reference/check_demon_melee.py
          python tools/reference/check_demon_lifecycle.py
          python tools/reference/check_demon_stand_run.py
          python tools/reference/check_demon_map_spawn.py
          python tools/reference/check_demon_map_context.py
          python tools/reference/check_map_scale.py
          python tools/reference/check_map_extent.py
          python tools/reference/check_demon_expanded_map.py
          python tools/reference/check_original_identity.py
          python tools/reference/check_canonical_demon.py
          python tools/reference/check_runtime_identity.py
          python tools/reference/check_original_registry.py
          python tools/reference/check_context_ownership.py
          python tools/reference/check_game_instance.py
          python tools/reference/check_diagnostic_free.py
      - name: Advisory stepping and allocation smoke
        if: runner.os == 'Linux'
        run: python3 tools/measure_stepping.py --check
      - name: Documentation links and archive integrity
        run: python tools/check_docs.py
      - name: Documentation
        run: cargo +stable doc --workspace --no-deps --locked

  msrv:
    name: Minimum Rust / 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test minimum supported Rust
        run: cargo +1.85.0 test --workspace --locked
