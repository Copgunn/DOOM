name: Windows artifact

# A downloadable Windows build of doom-play (M5b step 9). Informational and NOT a required
# check: no ruleset or branch protection names it, and its workflow and job names do not
# collide with the required check names reported by rust.yml.
#
# Triggers:
#  * workflow_dispatch: only offered by GitHub once this file is on the default branch.
#  * pull_request `labeled`: putting the label `windows-artifact` on the pull request starts
#    a build. This works before merge. Only `labeled` is used, so an ordinary push to a
#    labelled PR does not rebuild; remove and re-add the label to build the new head.
#
# The artifact holds doom-play.exe (C runtime linked statically, so no Visual C++
# redistributable is needed), LICENSE.TXT and a generated README.txt. No game data.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: windows-artifact-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'dispatch' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-artifact:
    name: Windows build artifact (doom-play)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'windows-artifact' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Build the PR head itself, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build doom-play (release, static C runtime)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +stable build --release --locked -p doom-play
      - name: Assemble the artifact directory
        shell: bash
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/doom-play-windows-x86_64"
          mkdir -p "$out"
          cp target/release/doom-play.exe "$out/"
          cp LICENSE.TXT "$out/"
          {
            echo "doom-play for Windows (x86_64), a Rust port of Linux DOOM 1.10 rules."
            echo
            echo "Commit:  $COMMIT"
            echo "Source:  $REPO_URL/tree/$COMMIT"
            echo "License: GPL-2.0-only (LICENSE.TXT). The corresponding source for this"
            echo "         binary is the commit above, at the repository URL above."
            echo
            echo "Requires an OpenGL 2.1 (or OpenGL ES 2) driver."
            echo
            echo "No game data is included. You need your own DOOM IWAD (Episode 1)."
            echo "Run from a command prompt:"
            echo
            echo "  doom-play.exe --iwad C:\\path\\to\\DOOM.WAD"
            echo
            echo "Run doom-play.exe --help for every option. Useful ones:"
            echo "  --map N              the map to start at, 1 to 9 (E1M1 to E1M9; default 1)"
            echo "  --skill 3            Ultra-Violence (the default, 2, is Hurt Me Plenty)"
            echo "  --game-mode MODE     retail or registered (see below)"
            echo
            echo "This build plays Episode 1 as ONE session (milestone M6a, up to the hand"
            echo "test): when you finish a map (either exit) you see the intermission, press"
            echo "fire or use to go on, and the next map starts with what you carry. When"
            echo "you die, a press of use starts the map again, as in the original."
            echo "Esc pauses; then R starts a new game at the start map, Q quits and saves,"
            echo "Esc resumes. The session ends only when you quit, or at a stop below."
            echo
            echo "Game mode: the original decides retail or registered from the file name"
            echo "only. This build uses a declared rule instead: retail if your IWAD has a"
            echo "fourth episode, otherwise registered, unless you force it with"
            echo "--game-mode. The launch line on the command prompt says which was used."
            echo
            echo "Demos: every session is written to a .lmp file in the folder"
            echo "doom-sessions beside where you run doom-play.exe (change it with"
            echo "--sessions DIR). The file name carries the map, the skill and the game"
            echo "mode. The last lines on the command prompt name the mode and where the"
            echo "session ended."
            echo
            echo "After E1M8 the finale plays: the text screen, then the picture, which"
            echo "stays until you quit. The screen melt between screens is shown."
            echo
            echo "Expected stops (not built yet; the screen says TIC REFUSED and the"
            echo "session ends; R starts a new game, Q quits):"
            echo "  - on skill 3, the start of E1M7 (reached from E1M6): not admitted yet"
            echo "  - skills 0 and 1 are refused at launch"
            echo "A music file that is missing from your IWAD also stops a session, as it"
            echo "stops the original. So does the finale picture in registered mode if"
            echo "your IWAD has no HELP2 picture."
            echo
            echo "Please send back the .lmp files from doom-sessions (and the last lines"
            echo "of the command prompt) after each session, whatever happened; they are"
            echo "checked against the original engine, and a stop or a difference is a"
            echo "finding, not your fault."
            echo
            echo "Sound: sound effects (no music) play through WASAPI, DirectSound or"
            echo "WinMM, whichever opens first; nothing needs to be installed. Check the"
            echo "device with: doom-play.exe --audio-probe (about one second of silence)."
            echo "  --volume N   volume at the speakers, 0 to 100 (default 100)"
            echo "  --no-sound   open no audio device; the game is otherwise the same"
            echo "  End key      mutes and unmutes; pausing is silent"
            echo "If no device opens, one line on standard error says so (visible in a"
            echo "command prompt) and the game runs without sound. The owner has played"
            echo "earlier builds on Windows and reported that sound plays; this exact build"
            echo "was built and tested by machine, and nobody has measured its sound."
          } > "$out/README.txt"
          ls -l "$out"
      - name: Upload the artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doom-play-windows-x86_64
          path: ${{ runner.temp }}/doom-play-windows-x86_64/*
          if-no-files-found: error
          retention-days: 30
