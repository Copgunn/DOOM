[package]
name = "doom-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-2.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
doom-test-evidence = { path = "../crates/doom-test-evidence" }
libfuzzer-sys = "0.4"
doom-wad = { path = "../crates/doom-wad" }
doom-map = { path = "../crates/doom-map" }
doom-sim = { path = "../crates/doom-sim" }
doom-types = { path = "../crates/doom-types" }

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "wad"
path = "fuzz_targets/wad.rs"
test = false
doc = false
bench = false

[[bin]]
name = "map"
path = "fuzz_targets/map.rs"
test = false
doc = false
bench = false

